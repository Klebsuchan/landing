<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3b30"/>
      <stop offset="100%" stop-color="#ff9500"/>
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffcc00"/>
      <stop offset="100%" stop-color="#ff3b30"/>
    </linearGradient>
  </defs>

  <!-- Neo-brutalist background container -->
  <rect x="3" y="7" width="54" height="54" rx="14" fill="#09090b" />
  <rect x="5" y="5" width="54" height="54" rx="14" fill="url(#bgGrad)" stroke="#09090b" stroke-width="3" />

  <!-- Rocket Exhaust / Speed Flames -->
  <path d="M 24 43 Q 22 51 26 53 Q 29 49 32 55 Q 35 49 38 53 Q 42 51 40 43 Z" fill="url(#flameGrad)" stroke="#09090b" stroke-width="2" />

  <!-- Rocket Body -->
  <path d="M 32 12 C 26 20 23 28 23 39 C 23 43 41 43 41 39 C 41 28 38 20 32 12 Z" fill="#ffffff" stroke="#09090b" stroke-width="3" stroke-linejoin="round" />

  <!-- Rocket Fins -->
  <path d="M 23 33 L 15 41 C 17 44 23 43 23 41 Z" fill="#ffcc00" stroke="#09090b" stroke-width="2" />
  <path d="M 41 33 L 49 41 C 47 44 41 43 41 41 Z" fill="#ffcc00" stroke="#09090b" stroke-width="2" />

  <!-- Cool Sunglasses on the Rocket -->
  <polygon points="25,23 31,23 30,28 26,28" fill="#09090b" />
  <polygon points="33,23 39,23 38,28 34,28" fill="#09090b" />
  <rect x="30" y="24" width="4" height="2" fill="#09090b" />
  <!-- Sunglasses reflections -->
  <line x1="27" y1="24" x2="29" y2="27" stroke="#38bdf8" stroke-width="1.2" stroke-linecap="round" />
  <line x1="35" y1="24" x2="37" y2="27" stroke="#38bdf8" stroke-width="1.2" stroke-linecap="round" />

  <!-- Big Fun Smirk Smile -->
  <path d="M 29 33 Q 32 36 35 33" fill="none" stroke="#09090b" stroke-width="2" stroke-linecap="round" />

  <!-- Sparkles / Conversion stars -->
  <path d="M 46 14 Q 48 18 52 18 Q 48 18 46 22 Q 44 18 40 18 Q 44 18 46 14 Z" fill="#facc15" stroke="#09090b" stroke-width="1" />
  <circle cx="17" cy="18" r="2.5" fill="#fef08a" stroke="#09090b" stroke-width="1" />
</svg>
